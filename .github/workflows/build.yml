name: Build MouseComparator PRO (.exe & .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS (.EXE) BUILD
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python numpy scipy pyinstaller ruff

      - name: Verify Required Assets Exist
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Error "HIÁNYZIK az assets/icon.ico!"
            exit 1
          }

      - name: Run Linter & Automated Unit Tests (Windows)
        shell: pwsh
        run: |
          ruff check --select E9,F,B MouseComparator.py tests/test_mousecomparator.py
          python -m unittest discover -s tests -v

      - name: Build Windows Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "MouseComparator_PRO" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.ico;assets" `
            --add-data "assets/icon.icns;assets" `
            --collect-all cv2 `
            --hidden-import numpy `
            --hidden-import scipy.stats `
            MouseComparator.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseComparator-PRO-Windows-x64
          path: dist/MouseComparator_PRO.exe

  # ============================================================================
  # 2. MACOS (.APP & .DMG) BUILD
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyObjC
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python numpy scipy pyinstaller ruff pyobjc-core pyobjc-framework-Cocoa

      - name: Verify macOS Icons Exist
        run: |
          if [ ! -f "assets/icon.icns" ]; then
            echo "HIÁNYZIK az assets/icon.icns!"
            exit 1
          fi

      - name: Run Linter & Automated Unit Tests (macOS)
        run: |
          ruff check --select E9,F,B MouseComparator.py tests/test_mousecomparator.py
          python3 -m unittest discover -s tests -v

      - name: Build macOS .app Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "MouseComparator PRO" \
            --icon "assets/icon.icns" \
            --osx-bundle-identifier "com.zalma.mousecomparator.pro" \
            --add-data "assets/icon.icns:assets" \
            --add-data "assets/icon.ico:assets" \
            --collect-all cv2 \
            --hidden-import numpy \
            --hidden-import scipy.stats \
            MouseComparator.py

      - name: Ad-Hoc Code Sign .app
        run: |
          codesign --force --deep --sign - "dist/MouseComparator PRO.app"

      - name: Package .app into Installer .dmg
        run: |
          mkdir -p dmg_staging
          cp -r "dist/MouseComparator PRO.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MouseComparator PRO" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "dist/MouseComparator_PRO_macOS.dmg"

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseComparator-PRO-macOS-DMG
          path: dist/MouseComparator_PRO_macOS.dmg

  # ============================================================================
  # 3. AUTOMATED GITHUB RELEASE (WHEN PUSHING A v* TAG, e.g. v0.0.1)
  # ============================================================================
  create-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/MouseComparator-PRO-Windows-x64/MouseComparator_PRO.exe
            release_assets/MouseComparator-PRO-macOS-DMG/MouseComparator_PRO_macOS.dmg
          generate_release_notes: true
